name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test, and check the knowledge base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm format:check

      - run: pnpm exec vitest run

      - name: code-kg check
        run: node dist/src/codekg/cli.js check

      # Pull requests must ship a refreshed knowledge base. Pushes to main only
      # warn, so a merge never leaves main red over a docs refresh.
      - name: code-kg drift
        shell: bash
        run: |
          set -o pipefail
          node dist/src/codekg/cli.js drift | tee drift.txt
          if grep -q '^## WARNING' drift.txt; then
            msg="code-kg drift reports warnings. Run 'code-kg update --no-enrich' (or 'node dist/src/codekg/cli.js update --no-enrich') and commit lat.md/ and .code-kg/materialization-manifest.json."
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              echo "::error title=Knowledge base is stale::$msg"
              exit 1
            fi
            echo "::warning title=Knowledge base is stale::$msg"
          fi
