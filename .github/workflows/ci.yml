name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test, and check the knowledge base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm format:check

      - run: pnpm exec vitest run

      - name: code-kg check
        run: node dist/src/codekg/cli.js check

      - name: code-kg drift
        shell: bash
        run: |
          set -o pipefail
          node dist/src/codekg/cli.js drift | tee drift.txt
          if grep -q '^## WARNING' drift.txt; then
            echo "::warning title=Knowledge base is stale::code-kg drift reports warnings. Run 'code-kg update' (or 'node dist/src/codekg/cli.js update --no-enrich') and commit lat.md/ and .code-kg/materialization-manifest.json."
          fi
